<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories — GourmetBite Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: #f4efe6;">

  <!-- Admin Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="/admin-dashboard.html" class="logo">
        🛡️ <span>Gourmet<b>Bite Admin</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="/admin-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="/manage-food.html" class="nav-link">Foods</a></li>
        <li><a href="/manage-categories.html" class="nav-link active">Categories</a></li>
        <li><a href="/manage-orders.html" class="nav-link">Orders</a></li>
        <li><a href="/manage-customers.html" class="nav-link">Customers</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/index.html" class="btn btn-secondary btn-sm" target="_blank">Storefront ↗</a>
        <button onclick="handleLogout()" class="btn btn-outline btn-sm">Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 36px; margin-bottom: 80px;">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px;">
      <div>
        <span style="color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.85rem;">Menu Taxonomy</span>
        <h1 style="font-size: 2.2rem; font-weight: 800;">Manage Food Categories</h1>
      </div>
      <button onclick="openCreateModal()" class="btn btn-primary">+ Add New Category</button>
    </div>

    <!-- Categories Table -->
    <div class="card-box">
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Image</th>
              <th>Category Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="categories-tbody">
            <tr>
              <td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Loading categories...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="category-modal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="modal-title" style="font-size: 1.3rem; font-weight: 800;">Add Category</h3>
        <button onclick="closeModal()" style="background: none; border: none; font-size: 1.4rem; cursor: pointer;">✕</button>
      </div>

      <form id="category-form">
        <input type="hidden" id="category-id">

        <div class="form-group">
          <label class="form-label" for="category-name">Category Name *</label>
          <input type="text" id="category-name" class="form-control" required placeholder="e.g. Gourmet Burgers">
        </div>

        <div class="form-group">
          <label class="form-label" for="category-image">Cover Image URL</label>
          <input type="url" id="category-image" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>

        <div class="form-group">
          <label class="form-label" for="category-desc">Description</label>
          <textarea id="category-desc" class="form-control" rows="3" placeholder="Category highlights"></textarea>
        </div>

        <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
          <input type="checkbox" id="category-active" checked style="accent-color: var(--accent); width: 18px; height: 18px;">
          <label for="category-active" style="font-weight: 600; cursor: pointer;">Active (Visible on Customer Menu)</label>
        </div>

        <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px;">
          <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="save-category-btn" class="btn btn-primary">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-bottom">
      &copy; 2026 GourmetBite Online Food Ordering System — Administration Portal.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    if (!Storage.isAuthenticated() || !Storage.isAdmin()) {
        window.location.href = '/admin-login.html';
    }

    async function loadCategories() {
        const tbody = document.getElementById('categories-tbody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--text-muted);">Loading categories...</td></tr>';

        try {
            const res = await apiRequest('/categories');
            const list = res?.data || [];

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No categories configured.</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(c => `
              <tr>
                <td style="width: 70px;">
                  <img src="${escapeHtml(c.imageUrl || '')}" alt="${escapeHtml(c.name)}" 
                       style="width: 56px; height: 56px; object-fit: cover; border-radius: var(--radius-sm);" onerror="handleImageError(this)">
                </td>
                <td><strong>${escapeHtml(c.name)}</strong></td>
                <td style="color: var(--text-muted); font-size: 0.88rem; max-width: 320px;">
                  ${escapeHtml(c.description || '—')}
                </td>
                <td>
                  <span class="status-badge ${c.active ? 'status-CONFIRMED' : 'status-CANCELLED'}">
                    ${c.active ? 'Active' : 'Disabled'}
                  </span>
                </td>
                <td>
                  <div style="display: flex; gap: 8px;">
                    <button onclick='openEditModal(${JSON.stringify(c).replace(/'/g, "&#39;")})' class="btn btn-secondary btn-sm">Edit</button>
                    <button onclick="deleteCategory('${c.id}')" class="btn btn-danger btn-sm">Delete</button>
                  </div>
                </td>
              </tr>
            `).join('');
        } catch (e) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 40px;">Failed to load categories: ${escapeHtml(e.message)}</td></tr>`;
        }
    }

    function openCreateModal() {
        document.getElementById('modal-title').textContent = 'Add Category';
        document.getElementById('category-id').value = '';
        document.getElementById('category-name').value = '';
        document.getElementById('category-image').value = '';
        document.getElementById('category-desc').value = '';
        document.getElementById('category-active').checked = true;

        document.getElementById('category-modal').classList.add('open');
    }

    function openEditModal(c) {
        document.getElementById('modal-title').textContent = 'Edit Category';
        document.getElementById('category-id').value = c.id;
        document.getElementById('category-name').value = c.name;
        document.getElementById('category-image').value = c.imageUrl || '';
        document.getElementById('category-desc').value = c.description || '';
        document.getElementById('category-active').checked = c.active;

        document.getElementById('category-modal').classList.add('open');
    }

    function closeModal() {
        document.getElementById('category-modal').classList.remove('open');
    }

    document.getElementById('category-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('category-id').value;
        const name = document.getElementById('category-name').value.trim();
        const imageUrl = document.getElementById('category-image').value.trim();
        const description = document.getElementById('category-desc').value.trim();
        const active = document.getElementById('category-active').checked;

        const payload = { name, imageUrl, description, active };
        const saveBtn = document.getElementById('save-category-btn');

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
            if (id) {
                await apiRequest(`/categories/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                showToast('Category updated successfully!', 'success');
            } else {
                await apiRequest('/categories', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showToast('Category created successfully!', 'success');
            }
            closeModal();
            loadCategories();
        } catch (err) {
            showToast(err.message, 'error');
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Category';
        }
    });

    async function deleteCategory(id) {
        if (!confirm('Are you sure you want to delete this category? Dishes associated with this category should be reassigned.')) return;
        try {
            await apiRequest(`/categories/${id}`, { method: 'DELETE' });
            showToast('Category deleted.', 'info');
            loadCategories();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
