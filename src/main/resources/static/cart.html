<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — GourmetBite</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="logo">
        🍽️ <span>Gourmet<b>Bite</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/menu.html" class="nav-link">Menu</a></li>
        <li><a href="/my-orders.html" class="nav-link">My Orders</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" aria-label="View Shopping Cart">
          🛒
          <span id="header-cart-badge" class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="header-auth-actions"></div>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 36px; margin-bottom: 80px;">
    <div style="margin-bottom: 24px;">
      <span style="color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 0.85rem;">Review Your Selection</span>
      <h1 style="font-size: 2.2rem; font-weight: 800;">Your Food Cart</h1>
    </div>

    <div id="cart-content">
      <div style="text-align: center; padding: 60px; color: var(--text-muted);">
        Loading your cart...
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      &copy; 2026 GourmetBite Online Food Ordering System.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    async function loadCart() {
        const container = document.getElementById('cart-content');

        if (!Storage.isAuthenticated()) {
            container.innerHTML = `
              <div class="card-box" style="text-align: center; padding: 60px;">
                <span style="font-size: 3rem;">🔒</span>
                <h2 style="margin: 16px 0 8px;">Please Log In to View Your Cart</h2>
                <p style="color: var(--text-muted); margin-bottom: 24px;">Your saved delicacies are waiting for you.</p>
                <a href="/login.html" class="btn btn-primary btn-lg">Log In Now</a>
              </div>
            `;
            return;
        }

        if (Storage.isAdmin()) {
            container.innerHTML = `
              <div class="card-box" style="text-align: center; padding: 60px;">
                <span style="font-size: 3rem;">🛡️</span>
                <h2 style="margin: 16px 0 8px;">Administrator View</h2>
                <p style="color: var(--text-muted); margin-bottom: 24px;">Administrators manage food, categories, and orders rather than purchasing.</p>
                <a href="/admin-dashboard.html" class="btn btn-primary">Go to Admin Dashboard</a>
              </div>
            `;
            return;
        }

        try {
            const res = await apiRequest('/cart');
            const cart = res?.data;
            const items = cart?.items || [];

            if (items.length === 0) {
                container.innerHTML = `
                  <div class="card-box" style="text-align: center; padding: 60px;">
                    <span style="font-size: 3.5rem;">🛒</span>
                    <h2 style="margin: 16px 0 8px;">Your Cart is Empty</h2>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">Looks like you haven't added any appetizing dishes yet.</p>
                    <a href="/menu.html" class="btn btn-primary btn-lg">Explore Menu & Order Food</a>
                  </div>
                `;
                syncHeader();
                return;
            }

            let itemsHtml = items.map(item => `
              <tr>
                <td style="width: 80px;">
                  <img src="${escapeHtml(item.imageUrl || '')}" alt="${escapeHtml(item.foodName)}" 
                       style="width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm);" onerror="handleImageError(this)">
                </td>
                <td>
                  <strong style="font-size: 1rem; display: block;">${escapeHtml(item.foodName)}</strong>
                  <span style="color: var(--text-muted); font-size: 0.85rem;">${formatCurrency(item.unitPrice)} each</span>
                  ${!item.available ? '<span style="color: var(--danger); font-size: 0.78rem; display:block; font-weight:700;">Currently Unavailable</span>' : ''}
                </td>
                <td>
                  <div class="qty-control">
                    <button class="qty-btn" onclick="updateItemQuantity('${item.foodItemId}', ${item.quantity - 1})">-</button>
                    <span class="qty-val">${item.quantity}</span>
                    <button class="qty-btn" onclick="updateItemQuantity('${item.foodItemId}', ${item.quantity + 1})">+</button>
                  </div>
                </td>
                <td style="font-weight: 700; font-size: 1.05rem;">
                  ${formatCurrency(item.lineTotal)}
                </td>
                <td>
                  <button onclick="removeItem('${item.foodItemId}')" class="btn btn-danger btn-sm" title="Remove">✕</button>
                </td>
              </tr>
            `).join('');

            container.innerHTML = `
              <div style="display: grid; grid-template-columns: 2fr 1.1fr; gap: 28px; align-items: start;">
                <div class="card-box" style="padding: 20px;">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3 style="font-size: 1.25rem;">Items (${cart.totalQuantity})</h3>
                    <button onclick="clearAllCart()" class="btn btn-secondary btn-sm" style="color: var(--danger);">Clear Entire Cart</button>
                  </div>
                  <div class="table-responsive">
                    <table class="table">
                      <thead>
                        <tr>
                          <th>Item</th>
                          <th>Details</th>
                          <th>Quantity</th>
                          <th>Line Total</th>
                          <th>Action</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${itemsHtml}
                      </tbody>
                    </table>
                  </div>
                </div>

                <div class="card-box">
                  <h3 style="font-size: 1.25rem; margin-bottom: 20px;">Order Summary</h3>
                  <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted);">
                    <span>Subtotal</span>
                    <span>${formatCurrency(cart.totalAmount)}</span>
                  </div>
                  <div style="display: flex; justify-content: space-between; margin-bottom: 12px; color: var(--text-muted);">
                    <span>Estimated Delivery Fee</span>
                    <span style="color: var(--success); font-weight: 700;">FREE</span>
                  </div>
                  <div style="border-top: 2px dashed var(--border-color); margin: 16px 0; padding-top: 16px; display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800;">
                    <span>Total</span>
                    <span style="color: var(--accent);">${formatCurrency(cart.totalAmount)}</span>
                  </div>

                  <a href="/checkout.html" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    Proceed to Checkout ➔
                  </a>
                  <a href="/menu.html" class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 12px;">
                    + Add More Items
                  </a>
                </div>
              </div>
            `;

            syncHeader();
        } catch (e) {
            container.innerHTML = `<div class="card-box" style="text-align: center; color: var(--danger); padding: 40px;">Error loading cart: ${escapeHtml(e.message)}</div>`;
        }
    }

    async function updateItemQuantity(foodItemId, newQty) {
        try {
            await apiRequest(`/cart/${foodItemId}`, {
                method: 'PUT',
                body: JSON.stringify({ quantity: newQty })
            });
            loadCart();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function removeItem(foodItemId) {
        if (!confirm('Remove this item from your cart?')) return;
        try {
            await apiRequest(`/cart/${foodItemId}`, {
                method: 'DELETE'
            });
            showToast('Item removed.', 'info');
            loadCart();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    async function clearAllCart() {
        if (!confirm('Are you sure you want to clear your cart?')) return;
        try {
            await apiRequest('/cart/clear', {
                method: 'DELETE'
            });
            showToast('Cart cleared.', 'info');
            loadCart();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadCart);
  </script>
</body>
</html>
