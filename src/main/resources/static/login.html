<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GourmetBite Food Ordering</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="logo">
        🍽️ <span>Gourmet<b>Bite</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/menu.html" class="nav-link">Menu</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" aria-label="View Shopping Cart">
          🛒
          <span id="header-cart-badge" class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="header-auth-actions"></div>
      </div>
    </div>
  </header>

  <!-- Login Form Container -->
  <main class="container" style="max-width: 460px; margin: 60px auto 100px;">
    <div class="card-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.2rem;">👋</span>
        <h2 style="font-size: 1.7rem; font-weight: 800; margin-top: 6px;">Welcome Back!</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access your cart and orders</p>
      </div>

      <div id="alert-box" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 0.9rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="/register.html" style="color: var(--accent); font-weight: 700;">Create Account</a>
      </div>

      <div style="border-top: 1px solid var(--border-color); margin-top: 24px; padding-top: 16px; text-align: center; font-size: 0.85rem;">
        Restaurant staff or Admin? <a href="/admin-login.html" style="color: var(--text-main); font-weight: 600;">Go to Admin Portal ➔</a>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-bottom">
      &copy; 2026 GourmetBite Online Food Ordering System.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    if (Storage.isAuthenticated()) {
        window.location.href = Storage.isAdmin() ? '/admin-dashboard.html' : '/menu.html';
    }

    const loginForm = document.getElementById('login-form');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = document.getElementById('submit-btn');

    loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verifying...';

        try {
            const res = await apiRequest('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            if (res.success && res.data) {
                Storage.setAuth(res.data.token, res.data);
                showToast('Welcome back, ' + res.data.name + '!', 'success');
                setTimeout(() => {
                    if (res.data.role === 'ADMIN') {
                        window.location.href = '/admin-dashboard.html';
                    } else {
                        window.location.href = '/menu.html';
                    }
                }, 800);
            }
        } catch (err) {
            alertBox.className = '';
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'var(--danger-bg)';
            alertBox.style.color = 'var(--danger)';
            alertBox.style.border = '1px solid var(--danger)';
            alertBox.textContent = err.message || 'Login failed. Please check credentials.';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
        }
    });
  </script>
</body>
</html>
