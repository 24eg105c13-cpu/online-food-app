<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — GourmetBite</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="logo">
        🍽️ <span>Gourmet<b>Bite</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/menu.html" class="nav-link">Menu</a></li>
        <li><a href="/my-orders.html" class="nav-link">My Orders</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" aria-label="View Shopping Cart">
          🛒
          <span id="header-cart-badge" class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="header-auth-actions"></div>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 600px; margin: 40px auto 80px;">
    <div class="card-box">
      <div style="text-align: center; margin-bottom: 24px;">
        <span style="font-size: 2.8rem;">👤</span>
        <h1 style="font-size: 1.8rem; font-weight: 800; margin-top: 6px;">Customer Profile</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Manage your delivery contact details and preferences</p>
      </div>

      <div id="alert-box" style="display: none; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 0.9rem;"></div>

      <form id="profile-form">
        <div class="form-group">
          <label class="form-label" for="profile-name">Full Name *</label>
          <input type="text" id="profile-name" class="form-control" required minlength="2">
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-email">Email Address</label>
          <input type="email" id="profile-email" class="form-control" readonly style="background-color: #eee;">
          <small style="color: var(--text-muted); font-size: 0.8rem;">Email address cannot be changed.</small>
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-phone">Contact Phone</label>
          <input type="tel" id="profile-phone" class="form-control" placeholder="+1 (555) 019-2834">
        </div>

        <div class="form-group">
          <label class="form-label" for="profile-address">Default Delivery Address</label>
          <textarea id="profile-address" class="form-control" rows="3" placeholder="Apartment / Street / City"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Account Role</label>
          <input type="text" id="profile-role" class="form-control" readonly style="background-color: #eee; font-weight: 700;">
        </div>

        <button type="submit" id="save-btn" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
          Save Profile Updates
        </button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      &copy; 2026 GourmetBite Online Food Ordering System.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    if (!Storage.isAuthenticated()) {
        window.location.href = '/login.html';
    }

    const alertBox = document.getElementById('alert-box');

    async function loadProfile() {
        try {
            const res = await apiRequest('/users/profile');
            const u = res?.data;

            if (u) {
                document.getElementById('profile-name').value = u.name || '';
                document.getElementById('profile-email').value = u.email || '';
                document.getElementById('profile-phone').value = u.phone || '';
                document.getElementById('profile-address').value = u.address || '';
                document.getElementById('profile-role').value = u.role || 'CUSTOMER';
            }
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.style.display = 'none';

        const name = document.getElementById('profile-name').value.trim();
        const phone = document.getElementById('profile-phone').value.trim();
        const address = document.getElementById('profile-address').value.trim();
        const saveBtn = document.getElementById('save-btn');

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';

        try {
            const res = await apiRequest('/users/profile', {
                method: 'PUT',
                body: JSON.stringify({ name, phone, address })
            });

            if (res.success && res.data) {
                const updatedUser = res.data;
                const localUser = Storage.getUser();
                if (localUser) {
                    localUser.name = updatedUser.name;
                    localStorage.setItem(Storage.USER_KEY, JSON.stringify(localUser));
                }
                showToast('Profile updated successfully!', 'success');
                syncHeader();
            }
        } catch (err) {
            alertBox.style.display = 'block';
            alertBox.style.backgroundColor = 'var(--danger-bg)';
            alertBox.style.color = 'var(--danger)';
            alertBox.textContent = err.message || 'Failed to update profile.';
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save Profile Updates';
        }
    });

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
