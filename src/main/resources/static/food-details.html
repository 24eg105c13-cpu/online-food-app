<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Item Details — GourmetBite</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container navbar">
      <a href="/index.html" class="logo">
        🍽️ <span>Gourmet<b>Bite</b></span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/menu.html" class="nav-link">Menu</a></li>
        <li><a href="/my-orders.html" class="nav-link">My Orders</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/cart.html" class="cart-btn" aria-label="View Shopping Cart">
          🛒
          <span id="header-cart-badge" class="cart-badge" style="display: none;">0</span>
        </a>
        <div id="header-auth-actions"></div>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 900px; margin: 40px auto 80px;">
    <a href="/menu.html" style="color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px;">
      ← Back to Menu
    </a>

    <div id="item-container" class="card-box" style="padding: 0; overflow: hidden;">
      <div style="text-align: center; padding: 60px; color: var(--text-muted);">
        Loading food details...
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      &copy; 2026 GourmetBite Online Food Ordering System.
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    let currentQty = 1;
    let foodData = null;

    async function loadItem() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const container = document.getElementById('item-container');

        if (!id) {
            container.innerHTML = '<div style="padding: 40px; text-align: center;">Item not found. <a href="/menu.html">Return to Menu</a></div>';
            return;
        }

        try {
            const res = await apiRequest(`/foods/${id}`);
            foodData = res?.data;

            if (!foodData) {
                container.innerHTML = '<div style="padding: 40px; text-align: center;">Item not found.</div>';
                return;
            }

            document.title = `${foodData.name} — GourmetBite`;

            container.innerHTML = `
              <div style="display: grid; grid-template-columns: 1fr 1.1fr;">
                <div style="height: 380px; overflow: hidden; background: var(--bg-secondary);">
                  <img src="${escapeHtml(foodData.imageUrl || '')}" alt="${escapeHtml(foodData.name)}" 
                       style="width: 100%; height: 100%; object-fit: cover;" onerror="handleImageError(this)">
                </div>

                <div style="padding: 32px 36px; display: flex; flex-direction: column; justify-content: space-between;">
                  <div>
                    <span class="food-category-tag" style="font-size: 0.85rem;">${escapeHtml(foodData.categoryName || 'General')}</span>
                    <h1 style="font-size: 2rem; font-weight: 800; margin: 6px 0 12px;">${escapeHtml(foodData.name)}</h1>
                    <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px;">
                      <span style="font-size: 1.8rem; font-weight: 800; color: var(--text-main);">${formatCurrency(foodData.price)}</span>
                      <span class="food-badge ${foodData.available ? 'available' : 'unavailable'}" style="position: static;">
                        ${foodData.available ? '● Available for Order' : '● Currently Unavailable'}
                      </span>
                    </div>
                    <p style="color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 24px;">
                      ${escapeHtml(foodData.description || 'Deliciously prepared with our chef secret recipe and fresh ingredients.')}
                    </p>
                  </div>

                  <div>
                    <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                      <label style="font-weight: 600; font-size: 0.95rem;">Quantity:</label>
                      <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty(-1)">-</button>
                        <span id="qty-val" class="qty-val">1</span>
                        <button class="qty-btn" onclick="updateQty(1)">+</button>
                      </div>
                    </div>

                    <button onclick="handleAddToCart()" class="btn btn-primary btn-lg" style="width: 100%;" ${!foodData.available ? 'disabled' : ''}>
                      🛒 Add to Cart • <span id="btn-total">${formatCurrency(foodData.price)}</span>
                    </button>
                  </div>
                </div>
              </div>
            `;
        } catch (e) {
            container.innerHTML = `<div style="padding: 40px; text-align: center; color: var(--danger);">Failed to load food details: ${escapeHtml(e.message)}</div>`;
        }
    }

    function updateQty(delta) {
        currentQty = Math.max(1, currentQty + delta);
        const qtyVal = document.getElementById('qty-val');
        if (qtyVal) qtyVal.textContent = currentQty;

        const btnTotal = document.getElementById('btn-total');
        if (btnTotal && foodData) {
            btnTotal.textContent = formatCurrency(Number(foodData.price) * currentQty);
        }
    }

    async function handleAddToCart() {
        if (!Storage.isAuthenticated()) {
            showToast('Please log in to add items to your cart.', 'info');
            setTimeout(() => window.location.href = '/login.html', 1000);
            return;
        }

        if (Storage.isAdmin()) {
            showToast('Administrators cannot place orders.', 'error');
            return;
        }

        try {
            await apiRequest('/cart/add', {
                method: 'POST',
                body: JSON.stringify({ foodItemId: foodData.id, quantity: currentQty })
            });
            showToast(`Added ${currentQty}x ${foodData.name} to cart!`, 'success');
            syncHeader();
        } catch (e) {
            showToast(e.message, 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', loadItem);
  </script>
</body>
</html>
